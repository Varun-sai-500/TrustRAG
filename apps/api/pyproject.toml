[project]
name = "trustrag-api"
version = "0.1.0"
description = "TRUSTRAG — AI Reliability Workbench backend"
# readme intentionally omitted: README.md lives at the repo root,
# not inside apps/api/ — hatchling would fail to find it in the Docker build context.
requires-python = ">=3.11"

dependencies = [
    # ── Web framework ────────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "orjson>=3.10.0",             # Fast JSON serializer (20-30% serialization savings)
    "python-multipart>=0.0.12",   # File uploads

    # ── Configuration & settings ─────────────────────────────────────────────
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",

    # ── Database ─────────────────────────────────────────────────────────────
    "pymongo[srv]>=4.7.0",
    "motor>=3.4.0",               # Async MongoDB driver
    "certifi>=2024.2.2",          # Explicit CA bundle for Atlas TLS handshakes

    # ── LangChain ecosystem ──────────────────────────────────────────────────
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-community>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-nvidia-ai-endpoints>=1.4.0",
    "langgraph>=0.2.0",

    # ── Model Context Protocol & Search ──────────────────────────────────────
    "mcp>=2.1.0",
    "tavily-python>=0.8.0",
    "duckduckgo-search>=8.0.0",
    "ddgs>=9.16.0",

    # ── Vector store ─────────────────────────────────────────────────────────
    "qdrant-client>=1.10.0",
    "langchain-qdrant>=0.2.0",

    # ── Document processing ──────────────────────────────────────────────────
    "pymupdf>=1.24.0",            # PDF parsing (fitz) — open source
    "rapidocr-onnxruntime>=1.4.4",  # OCR fallback for scanned pages (ONNX, torch-free)
    "chardet>=5.2.0",             # Encoding detection for text files
    "defusedxml>=0.7.1",          # Defused XML parsing against XXE attacks

    # ── Security ─────────────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",  # JWT
    "passlib[bcrypt]>=1.7.4",            # Password hashing
    "slowapi>=0.1.9",                    # Rate limiting for FastAPI
    "email-validator>=2.0.0",            # Email format validation for Pydantic EmailStr
    "hvac>=2.2.0",                       # HashiCorp Vault client (open source)
    "python-dotenv>=1.0.0",              # .env file loading

    # ── Observability ────────────────────────────────────────────────────────
    "structlog>=24.1.0",          # Structured JSON logging

    # ── HTTP ─────────────────────────────────────────────────────────────────
    "httpx>=0.27.0",              # Async HTTP client (for SSE, health checks)

    # ── Utilities ────────────────────────────────────────────────────────────
    "python-dateutil>=2.9.0",
    "xxhash>=3.4.1",              # Fast hashing for content deduplication

    # ── Local embeddings (ONNX Runtime, torch-free) ──────────────────────────
    "onnxruntime>=1.20.0",        # BGE-small via ONNX (EMBEDDING_PROVIDER=onnx)
]

[project.optional-dependencies]
local-models = [
    "sentence-transformers>=3.0.0",
    "langchain-huggingface>=0.1.0",
]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",              # TestClient
    "ruff>=0.4.0",                # Linter + formatter
    "mypy>=1.10.0",
    "types-pyyaml",
    "types-python-jose",
    "types-passlib",
]

[build-system]
# setuptools handles both regular and editable installs reliably in Docker.
# hatchling requires the readme file to exist during editable builds,
# which fails when apps/api/ is the Docker build context (README.md is at repo root).
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "S", "B", "A", "C4", "RUF"]
ignore = [
    "S101",   # Use of assert (allowed in tests)
    "S104",   # Binding to 0.0.0.0 (needed for Docker)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "N"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency injection uses function calls in parameter defaults
# (Depends/Query/File/...) — this is intentional and bytes-stable, so treat
# them as immutable like FastAPI's own lint config does.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Body",
    "fastapi.File",
    "fastapi.Form",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing -v"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
